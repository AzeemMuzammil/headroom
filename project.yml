name: Headroom
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Headroom:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Headroom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Unofficial community app. Not affiliated with Anthropic."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: headroom-statusline
        embed: true
        copy:
          destination: executables

  # Tiny helper that Claude Code runs as its status line command. It saves the plan-limit
  # percentages Claude Code passes it, so the app never needs Claude Code's login.
  headroom-statusline:
    type: tool
    platform: macOS
    sources: [StatusLineHelper]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).statusline"
        SKIP_INSTALL: YES
